# Testing-only stack for Qlane pull-request sandboxes. It builds the pull
# request's code. Nothing that n8n ships uses this file.
services:
  n8n:
    image: n8n-qlane-pr:test # not in any registry, so a pull fails instead of testing a release
    pull_policy: build
    build:
      context: .
      dockerfile: docker/qlane/Dockerfile
    ports:
      - "5678:5678"
    environment:
      N8N_LISTEN_ADDRESS: 0.0.0.0
      N8N_PORT: "5678"
      N8N_EDITOR_BASE_URL: ${QLANE_SANDBOX_PUBLIC_URL:-http://localhost:5678}
      WEBHOOK_URL: ${QLANE_SANDBOX_PUBLIC_URL:-http://localhost:5678}
      # Keep the tester on the product, not on prompts and outbound calls.
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      # The owner that seed-owner.mjs creates. The password is a variable on the test target.
      N8N_QA_OWNER_EMAIL: qa@example.com
      N8N_QA_OWNER_PASSWORD: ${N8N_QA_OWNER_PASSWORD:?set N8N_QA_OWNER_PASSWORD on the test target}
    healthcheck:
      # /healthz answers before migrations finish. /healthz/readiness waits for them.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5678/healthz/readiness').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 300s # the first boot runs every database migration
    labels:
      ai.qlane.postdeploy: "node docker/qlane/seed-owner.mjs"
